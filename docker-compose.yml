services:
  worker1: &worker
    build: .
    volumes: ["./data:/data:ro"]
    environment: {DATA_PATH: /data/sample.csv, PORT: "8000"}
  worker2: *worker
  worker3: *worker
  coordinator:
    build: .
    profiles: ["run"]
    depends_on: [worker1, worker2, worker3]
    volumes: ["./data:/data:ro", "./resultados:/app/resultados"]
    environment:
      DATA_PATH: /data/sample.csv
      WORKER_URLS: http://worker1:8000,http://worker2:8000,http://worker3:8000
    command: ["python", "coordinator.py", "--data", "/data/sample.csv"]
